name: omnimcp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnimcp
      POSTGRES_USER: omnimcp
      POSTGRES_PASSWORD: omnimcp
    ports:
      - "5432:5432"
    volumes:
      - omnimcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies infra/migrations/*.sql in order, then exits. Re-run any time
  # with `docker compose run --rm migrate`.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/migrations:/migrations:ro
    environment:
      PGPASSWORD: omnimcp
    entrypoint:
      - sh
      - -c
      - |
        for f in /migrations/*.sql; do
          echo "applying $$f";
          psql -h postgres -U omnimcp -d omnimcp -v ON_ERROR_STOP=1 -f "$$f" || exit 1;
        done

  # Builds the whole workspace once, then serves the REST API. The same built
  # node_modules/dist are what apps/mcp-gateway and every connector use, since a
  # connector is spawned as a child process from this same filesystem.
  rest-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - omnimcp_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://omnimcp:omnimcp@postgres:5432/omnimcp
      REDIS_URL: redis://redis:6379
      CONNECTORS_DIR: /app/connectors
    command: sh -c "npm install && npm run build && npm run dev:rest-api"

  # Polls for due scheduled workflows and runs them — see docs/architecture.md's
  # "Automatización" section. Always-on, same pattern as rest-api (not profile-gated
  # like gateway, since it isn't a stdio process).
  automation-worker:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - omnimcp_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://omnimcp:omnimcp@postgres:5432/omnimcp
      REDIS_URL: redis://redis:6379
      CONNECTORS_DIR: /app/connectors
    command: sh -c "npm install && npm run build && npm run dev:automation-worker"

  # Not part of `docker compose up` by default — an MCP gateway is a stdio process an
  # MCP client (Claude Desktop, etc.) spawns on demand, not an always-on service. Run
  # it explicitly with: docker compose --profile gateway run --rm gateway
  gateway:
    image: node:20-alpine
    working_dir: /app
    profiles: ["gateway"]
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - omnimcp_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://omnimcp:omnimcp@postgres:5432/omnimcp
      REDIS_URL: redis://redis:6379
      CONNECTORS_DIR: /app/connectors
    command: sh -c "npm install && npm run build && npm run dev:gateway"

  # Serves the compiled panel (`next start`, a real production build — not the
  # `next dev` server used for local-only testing). Talks to rest-api over the
  # public IP (NEXT_PUBLIC_* vars are inlined into the browser bundle at build
  # time, so they must be an address the user's browser can reach, not the
  # internal Docker service name).
  web-panel:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - omnimcp_node_modules:/app/node_modules
    ports:
      - "3300:3300"
    depends_on:
      - rest-api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://167.71.99.75:3000
      NEXT_PUBLIC_DEFAULT_TENANT_ID: 63ceb6d3-701b-4295-8f54-18f33769628c
    command: sh -c "npm install && npm run build && npm run start:web-panel"

volumes:
  omnimcp_postgres_data:
  omnimcp_node_modules:
